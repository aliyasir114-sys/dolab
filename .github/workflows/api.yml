name: API tests

on:
  push:
    paths: ["services/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["services/api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  # Quick run on SQLite (the default for local development).
  sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: pytest -q

  # The run that counts (plan 4.5): PostgreSQL 16 set up as production will be.
  # bootstrap.sql -> migrations as dolab_deploy -> alembic check -> every test as dolab_app,
  # plus the role and privilege tests (DB13–DB23) with an admin connection.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-not-a-secret
          POSTGRES_DB: dolab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_URL: postgresql://postgres:ci-admin-not-a-secret@localhost:5432/dolab
      # Throwaway password for the CI database's login roles only.
      DOLAB_TEST_PG_PASSWORD: ci-roles-not-a-secret
      DOLAB_TEST_PG_ADMIN_URL: postgresql+psycopg://postgres:ci-admin-not-a-secret@localhost:5432/dolab
      DOLAB_MIGRATION_URL: postgresql+psycopg://dolab_deploy:ci-roles-not-a-secret@localhost:5432/dolab
      DOLAB_DATABASE_URL: postgresql+psycopg://dolab_app:ci-roles-not-a-secret@localhost:5432/dolab
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Bootstrap roles and schema (infrastructure identity)
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f dbtools/bootstrap.sql
          # Run twice: the bootstrap must be safe to repeat.
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f dbtools/bootstrap.sql
          for role in dolab_deploy dolab_app dolab_reconciler; do
            psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -c "ALTER ROLE $role PASSWORD '$DOLAB_TEST_PG_PASSWORD'"
          done
      - name: Migrate as dolab_deploy
        run: |
          alembic upgrade head
          alembic check
          alembic current
      - run: pytest -q -rs

  # Photo storage on S3-compatible object storage (plan 4.6, step C-2): every test, with the
  # photos in a private MinIO bucket instead of on disk. MinIO stands in for the provider chosen
  # in step H; it does not replace the B7 test on the real provider.
  minio:
    runs-on: ubuntu-latest
    env:
      DOLAB_STORAGE: s3
      DOLAB_S3_BUCKET: dolab-ci
      DOLAB_S3_ENDPOINT_URL: http://localhost:9000
      # This MinIO has no key service, so it cannot encrypt at rest; production refuses "none".
      DOLAB_S3_ENCRYPTION: none
      # The deletion ledger in a bucket of its own (plan 4.10.1).
      DOLAB_LEDGER_STORAGE: s3
      DOLAB_LEDGER_BUCKET: dolab-ci-ledger
      # Throwaway credentials for the CI MinIO only.
      AWS_ACCESS_KEY_ID: dolab-ci
      AWS_SECRET_ACCESS_KEY: ci-minio-not-a-secret
      AWS_DEFAULT_REGION: us-east-1
      # The reconciliation job's read-only ledger user (throwaway, CI MinIO only).
      DOLAB_TEST_LEDGER_READER_KEY: dolab-ci-ledger-reader
      DOLAB_TEST_LEDGER_READER_SECRET: ci-reader-not-a-secret
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Start MinIO with a private bucket
        run: |
          # MinIO no longer publishes images (Docker Hub and quay.io refuse anonymous pulls since
          # 2026), so CI uses Chainguard's free build of MinIO. It runs as a non-root user: data
          # goes in /tmp inside the container.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            cgr.dev/chainguard/minio:latest server /tmp/minio-data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 1; done
          curl -fsS http://localhost:9000/minio/health/live
          docker image inspect cgr.dev/chainguard/minio:latest --format 'MinIO image {{index .RepoDigests 0}}'
          python -c "import boto3; c = boto3.client('s3', endpoint_url='http://localhost:9000'); c.create_bucket(Bucket='dolab-ci'); c.create_bucket(Bucket='dolab-ci-ledger')"
      - name: Read-only ledger identity for the reconciliation job (mc, CI only)
        env:
          # Chainguard's build of the MinIO client: the same supplier as the MinIO server above.
          # Pinned by digest (the image whose signature was first verified in CI on 2026-11-26);
          # its signature is still checked on every run. To update: take the new digest from a
          # verified run and change it here in a reviewed pull request.
          MC_IMAGE: cgr.dev/chainguard/minio-client@sha256:fac83a05890847b4af12e406018088d54f16f1d53e6e39cb68e56591be6e5b3a
          COSIGN_IMAGE: cgr.dev/chainguard/cosign@sha256:bfc3e068b714f251042d6c1b2fe5f1c3ee8e577d3d36271ae62be5f3a00cc185
        run: |
          docker pull -q "$MC_IMAGE" && docker pull -q "$COSIGN_IMAGE"
          # Chainguard signs its images in its public release workflow (Sigstore, keyless).
          docker run --rm "$COSIGN_IMAGE" verify "$MC_IMAGE" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            > /dev/null
          echo "mc image signature verified"
          mc() {
            docker run --rm --network host -v "$PWD/ops:/ops:ro" \
              -e MC_HOST_ci="http://$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY@localhost:9000" \
              "$MC_IMAGE" --config-dir /tmp/mc "$@"
          }
          mc admin user add ci "$DOLAB_TEST_LEDGER_READER_KEY" "$DOLAB_TEST_LEDGER_READER_SECRET"
          mc admin policy create ci dolab-ledger-read /ops/ledger-reader-policy.json
          mc admin policy attach ci dolab-ledger-read --user "$DOLAB_TEST_LEDGER_READER_KEY"
      - run: pytest -q -rs
      - name: MinIO log
        if: failure()
        run: docker logs minio | tail -n 50
