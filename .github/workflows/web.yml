name: Web

on:
  push:
    paths: ["apps/web/**", "services/api/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "services/api/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://api.dolab.test/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No lockfile yet (see the PR): install from package.json. Switch to `npm ci` once it exists.
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build (includes the TypeScript check)
        run: npm run build
      - name: Known vulnerabilities in runtime packages
        run: npm audit --omit=dev --audit-level=high

  # The whole scenario in Chromium against the real API (SQLite, development settings, test data
  # only). Screenshots are kept as an artifact for review.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/v1
      WEB_URL: http://localhost:3000
      SHOTS_DIR: e2e/shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Start the API
        working-directory: services/api
        env:
          DOLAB_CORS_ORIGINS: http://localhost:3000
          DOLAB_DATABASE_URL: sqlite:///./e2e.db
          DOLAB_MEDIA_DIR: ./e2e-media
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and start the site
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          nohup npm run start -- -p 3000 > /tmp/web.log 2>&1 &
          npx playwright install --with-deps chromium
      - name: Wait for both
        run: |
          for url in http://localhost:8000/docs http://localhost:3000/ar/sign-in; do
            for i in $(seq 1 60); do curl -fsS -o /dev/null "$url" && break; sleep 1; done
            curl -fsS -o /dev/null "$url"
          done
      - name: Scenario
        working-directory: apps/web
        run: npm run e2e
      - name: Server logs
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/web/e2e/shots/
          if-no-files-found: ignore
