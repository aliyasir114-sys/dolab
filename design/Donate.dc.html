<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التبرع بالملابس</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F5; color: #080808; display: flex; flex-direction: column">
<div style="flex: 1; min-height: 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5E5E5E">امنح قطعك حياة ثانية</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">تبرّع بملابسك</h1>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.7; color: #5E5E5E">اختر من دولابك القطع التي تريد التبرع بها. نقترح عليك ما لم ترتده منذ فترة.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.on}}" style="min-height: 64px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; text-align: start; border: 1px solid #080808; background: {{it.bg}}; color: {{it.fg}}; font-family: inherit">
<span style="width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid currentColor; font-size: 14px; font-weight: 700">{{it.mark}}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{it.name}}</span><span style="font-size: 12px">{{it.hint}}</span></span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="org" style="font-size: 12px; color: #5E5E5E">جهة التبرع</label>
<select id="org" style="height: 48px; padding: 0 12px; background: #FFFFFF; border: 1px solid #080808; color: #080808; font-size: 15px; font-family: inherit">
<option>[اسم الجهة الخيرية]</option>
<option>تسليم مباشر لشخص أعرفه</option>
</select>
</div>
<button type="button" onClick="{{confirm}}" style="height: 52px; border: 0; background: #080808; color: #F5F5F5; font-size: 16px; font-weight: 700; font-family: inherit">{{confirmLabel}}</button>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5E5E5E">{{status}}</p>
</div>
<nav aria-label="التنقل الرئيسي" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #D9D9D9; font-size: 11px">
<a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9H3z"></path></svg>الرئيسية</a>
<a href="Wardrobe.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #080808; font-weight: 700; box-shadow: inset 0 2px 0 #080808"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18"></rect><path d="M12 3v18M9.5 11v2M14.5 11v2"></path></svg>دولابي</a>
<a href="Stylist.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path></svg>المستشار</a>
<a href="Market.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 016 0v2"></path></svg>السوق</a>
<a href="Heritage.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M12 8l4 4-4 4-4-4z"></path></svg>التراث</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: { 'جاكيت رمادي': true }, done: false }; }
renderVals() {
const st = this.state || {};
const picked = st.picked || {};
const items = [
{ name: 'جاكيت رمادي', hint: 'لم يُرتدَ منذ فترة طويلة' },
{ name: 'شال', hint: 'معروض للبيع — يمكن تحويله إلى تبرع' },
{ name: 'قميص أبيض كلاسيكي', hint: 'حالة جيدة جداً' },
{ name: 'بنطلون أسود', hint: 'حالة جيدة' }
].map((x) => {
const on = !!picked[x.name];
return { ...x, on, mark: on ? '✓' : '', bg: on ? '#080808' : '#FFFFFF', fg: on ? '#F5F5F5' : '#080808',
toggle: () => this.setState({ picked: { ...picked, [x.name]: !on }, done: false }) };
});
const n = items.filter((x) => x.on).length;
return {
items,
confirm: () => this.setState({ done: n > 0 }),
confirmLabel: 'تأكيد التبرع (' + n + ')',
status: st.done ? 'شكراً لك — سُجّلت القطع المختارة في دولابك بحالة «تم التبرع به».' : 'بعد التأكيد تنتقل القطع إلى حالة «تم التبرع به» وتخرج من اقتراحات الإطلالات.'
};
}
}
</script>
</body>
</html>
