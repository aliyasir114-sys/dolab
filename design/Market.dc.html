<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سوق دولاب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F5; color: #080808; display: flex; flex-direction: column">
<div style="flex: 1; min-height: 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; height: 48px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700">سوق دولاب</h1>
<a href="Sell.dc.html" style="height: 44px; padding: 0 16px; display: flex; align-items: center; background: #080808; color: #F5F5F5; font-size: 14px; font-weight: 600">+ اعرض منتجك</a>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="q" style="font-size: 12px; color: #5E5E5E">ابحث بالنوع أو اللون أو المقاس</label>
<input id="q" type="search" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #080808; color: #080808; font-size: 16px; font-family: inherit">
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="flex: 1; height: 44px; border: 1px solid #080808; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600; font-family: inherit">{{f.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #D9D9D9; display: flex; flex-direction: column">
<div style="height: 104px; background: #E6E6E6; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #5E5E5E">صورة المنتج</div>
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 12px; color: #5E5E5E">{{p.seller}} · {{p.kind}}</span>
<span style="font-size: 14px; font-weight: 700">[السعر]</span>
</div>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5E5E5E">كل منتج هنا مرّ بالفحص والمراجعة قبل نشره.</p>
</div>
<nav aria-label="التنقل الرئيسي" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #D9D9D9; font-size: 11px">
<a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9H3z"></path></svg>الرئيسية</a>
<a href="Wardrobe.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18"></rect><path d="M12 3v18M9.5 11v2M14.5 11v2"></path></svg>دولابي</a>
<a href="Stylist.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path></svg>المستشار</a>
<a href="Market.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #080808; font-weight: 700; box-shadow: inset 0 2px 0 #080808"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 016 0v2"></path></svg>السوق</a>
<a href="Heritage.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M12 8l4 4-4 4-4-4z"></path></svg>التراث</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { filter: 'الكل' }; }
renderVals() {
const all = [
{ name: 'ثوب سوداني', seller: 'مصمم', kind: 'تراثي' },
{ name: 'جلابية بيضاء', seller: 'متجر', kind: 'جديد' },
{ name: 'جاكيت رسمي', seller: 'فرد', kind: 'مستعمل' },
{ name: 'شال', seller: 'متجر', kind: 'تراثي' },
{ name: 'حذاء جلدي', seller: 'متجر', kind: 'جديد' },
{ name: 'قميص كتان', seller: 'فرد', kind: 'مستعمل' }
];
const cur = (this.state && this.state.filter) || 'الكل';
const products = all.filter((p) => cur === 'الكل' || p.kind === cur).slice(0, 4);
const filters = ['الكل', 'جديد', 'مستعمل', 'تراثي'].map((label) => ({
label, on: label === cur,
bg: label === cur ? '#080808' : 'transparent',
fg: label === cur ? '#F5F5F5' : '#080808',
pick: () => this.setState({ filter: label })
}));
return { products, filters };
}
}
</script>
</body>
</html>
