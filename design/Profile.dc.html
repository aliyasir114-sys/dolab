<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملفي الشخصي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F5; color: #080808; display: flex; flex-direction: column">
<div style="flex: 1; min-height: 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5E5E5E">لملاءمة الاقتراحات والمقاسات</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">ملفي الشخصي</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="h" style="font-size: 12px; color: #5E5E5E">الطول (سم)</label>
<input id="h" type="number" inputmode="numeric" style="height: 48px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; border: 1px solid #080808; color: #080808; font-size: 16px; font-family: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="w" style="font-size: 12px; color: #5E5E5E">الوزن (كجم)</label>
<input id="w" type="number" inputmode="numeric" style="height: 48px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; border: 1px solid #080808; color: #080808; font-size: 16px; font-family: inherit">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="sz" style="font-size: 12px; color: #5E5E5E">مقاسي المعتاد</label>
<select id="sz" style="height: 48px; padding: 0 12px; background: #FFFFFF; border: 1px solid #080808; color: #080808; font-size: 15px; font-family: inherit">
<option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="bl" style="font-size: 12px; color: #5E5E5E">شكل الجسم</span>
<div role="group" aria-labelledby="bl" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{bodies}}" as="b" hint-placeholder-count="5">
<button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="height: 44px; padding: 0 12px; border: 1px solid #080808; background: {{b.bg}}; color: {{b.fg}}; font-size: 13px; font-weight: 600; font-family: inherit">{{b.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="fl" style="font-size: 12px; color: #5E5E5E">شكل الوجه</span>
<div role="group" aria-labelledby="fl" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{faces}}" as="f" hint-placeholder-count="5">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height: 44px; padding: 0 12px; border: 1px solid #080808; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600; font-family: inherit">{{f.label}}</button>
</sc-for>
</div>
</div>
<button type="button" onClick="{{save}}" style="height: 52px; border: 0; background: #080808; color: #F5F5F5; font-size: 16px; font-weight: 700; font-family: inherit">{{saveLabel}}</button>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5E5E5E">كل الحقول اختيارية. قياساتك مشفّرة ولا يراها غيرك، ولا نفرض شكلاً جمالياً معيناً — نساعدك على إبراز ذوقك.</p>
</div>
<nav aria-label="التنقل الرئيسي" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #D9D9D9; font-size: 11px">
<a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9H3z"></path></svg>الرئيسية</a>
<a href="Wardrobe.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18"></rect><path d="M12 3v18M9.5 11v2M14.5 11v2"></path></svg>دولابي</a>
<a href="Stylist.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path></svg>المستشار</a>
<a href="Market.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 016 0v2"></path></svg>السوق</a>
<a href="Heritage.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M12 8l4 4-4 4-4-4z"></path></svg>التراث</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { body: '', face: '', saved: false }; }
renderVals() {
const st = this.state || {};
const chips = (labels, key) => labels.map((label) => {
const on = st[key] === label;
return { label, on, bg: on ? '#080808' : 'transparent', fg: on ? '#F5F5F5' : '#080808',
pick: () => this.setState({ [key]: on ? '' : label, saved: false }) };
});
return {
bodies: chips(['مستطيل', 'مثلث', 'مثلث مقلوب', 'بيضاوي', 'ساعة رملية'], 'body'),
faces: chips(['بيضاوي', 'دائري', 'مربع', 'قلب', 'طويل'], 'face'),
save: () => this.setState({ saved: true }),
saveLabel: st.saved ? 'تم الحفظ' : 'حفظ الملف'
};
}
}
</script>
</body>
</html>
