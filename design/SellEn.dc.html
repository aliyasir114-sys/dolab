<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Publishing steps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="ltr" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F5; color: #080808; display: flex; flex-direction: column">
<div style="flex: 1; min-height: 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5E5E5E">Dolab Market · nothing is published instantly</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">List a piece for sale</h1>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #FFFFFF; border: {{s.border}}">
<span style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; border: 1px solid #080808; background: {{s.markBg}}; color: {{s.markFg}}">{{s.mark}}</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{s.title}}</span>
<span style="font-size: 12px; line-height: 1.5; color: #5E5E5E">{{s.desc}}</span>
</div>
</li>
</sc-for>
</ol>
<sc-if value="{{inProgress}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{next}}" style="height: 52px; border: 0; background: #080808; color: #F5F5F5; font-size: 16px; font-weight: 700; font-family: inherit">{{nextLabel}}</button>
</sc-if>
<sc-if value="{{published}}" hint-placeholder-val="{{false}}">
<a href="MarketEn.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; background: #080808; color: #F5F5F5; font-size: 16px; font-weight: 700">Published — go to the market</a>
</sc-if>
</div>
<nav aria-label="Main navigation" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #D9D9D9; font-size: 11px">
<a href="HomeEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9H3z"></path></svg>Home</a>
<a href="WardrobeEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18"></rect><path d="M12 3v18M9.5 11v2M14.5 11v2"></path></svg>Wardrobe</a>
<a href="StylistEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path></svg>Stylist</a>
<a href="MarketEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #080808; font-weight: 700; box-shadow: inset 0 2px 0 #080808"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 016 0v2"></path></svg>Market</a>
<a href="HeritageEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M12 8l4 4-4 4-4-4z"></path></svg>Heritage</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { step: 0 }; }
renderVals() {
const cur = (this.state && this.state.step) || 0;
const raw = [
['Upload product', 'Photos, description, price, size and condition.'],
['Auto check', 'Confirms the product is clothing or fashion.'],
['Content review', 'Quality, duplicates and prohibited products.'],
['Seller confirmation', 'You confirm the details, photos and price.'],
['Publish approval', 'Approved by the system or the admin team.'],
['Product goes live', 'Visible in the market and taking orders.']
];
const steps = raw.map((r, i) => ({
title: r[0], desc: r[1],
mark: i < cur ? '✓' : String(i + 1),
markBg: i < cur ? '#080808' : '#FFFFFF',
markFg: i < cur ? '#F5F5F5' : '#080808',
border: i === cur ? '2px solid #080808' : '1px solid #D9D9D9'
}));
const published = cur >= raw.length;
return {
steps, published, inProgress: !published,
nextLabel: published ? '' : 'Complete: ' + raw[cur][0],
next: () => this.setState({ step: cur + 1 })
};
}
}
</script>
</body>
</html>
