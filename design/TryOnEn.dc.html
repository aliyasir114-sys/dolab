<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Virtual Try-On</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="ltr" style="width: 390px; height: 844px; box-sizing: border-box; background: #080808; color: #F5F5F5; display: flex; flex-direction: column">
<div style="flex: 1; min-height: 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #A8A8A8">Try before you wear</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Virtual Try-On</h1>
</div>
<div style="height: 330px; border: 1px dashed #A8A8A8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 0 24px">
<span style="font-size: 15px; font-weight: 600">{{stage}}</span>
<span style="font-size: 12px; color: #A8A8A8">{{stageSub}}</span>
</div>
<span style="font-size: 13px; color: #A8A8A8">Pick a piece from your wardrobe or the market</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{pieces}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="height: 64px; border: 1px solid #F5F5F5; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; font-weight: 600; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span>{{p.name}}</span><span style="font-size: 10px; font-weight: 400">{{p.from}}</span></button>
</sc-for>
</div>
<button type="button" onClick="{{run}}" style="height: 52px; border: 0; background: #F5F5F5; color: #080808; font-size: 16px; font-weight: 700; font-family: inherit">Try it now</button>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #A8A8A8">The result is approximate and does not guarantee real fit or how the fabric falls.</p>
</div>
<nav aria-label="Main navigation" style="display: flex; height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #D9D9D9; font-size: 11px">
<a href="HomeEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9H3z"></path></svg>Home</a>
<a href="WardrobeEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18"></rect><path d="M12 3v18M9.5 11v2M14.5 11v2"></path></svg>Wardrobe</a>
<a href="StylistEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path></svg>Stylist</a>
<a href="MarketEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 016 0v2"></path></svg>Market</a>
<a href="HeritageEn.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E5E5E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M12 8l4 4-4 4-4-4z"></path></svg>Heritage</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { piece: 'White shirt', done: false }; }
renderVals() {
const st = this.state || {};
const cur = st.piece || 'White shirt';
const pieces = [
{ name: 'White shirt', from: 'Your wardrobe' },
{ name: 'White jalabiya', from: 'Your wardrobe' },
{ name: 'Sudanese toub', from: 'Market' }
].map((p) => ({
...p, on: p.name === cur,
bg: p.name === cur ? '#F5F5F5' : 'transparent',
fg: p.name === cur ? '#080808' : '#F5F5F5',
pick: () => this.setState({ piece: p.name, done: false })
}));
return {
pieces,
run: () => this.setState({ done: true }),
stage: st.done ? 'Preview: ' + cur + ' on your photo' : 'Place your full-body photo here',
stageSub: st.done ? 'The try-on result appears here — save it or compare with another piece' : 'A clear full-body photo in natural light, no filters'
};
}
}
</script>
</body>
</html>
