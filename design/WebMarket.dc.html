<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الموقع — سوق دولاب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; min-height: 800px; background: #F5F5F5; color: #080808; display: flex; flex-direction: column">
<header style="background: #080808; color: #F5F5F5; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="WebHome.dc.html" style="display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="48" height="24" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2 22L10 4l8 18M15 22L24 2l9 20M30 22l8-16 8 16M1 22h46"></path></svg><span style="font-size: 24px; font-weight: 700">دولاب</span></a>
<nav aria-label="التنقل الرئيسي" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 15px">
<a href="WebHome.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">الرئيسية</a>
<a href="WebWardrobe.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">دولابي</a>
<a href="Stylist.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">المستشار</a>
<a href="WebMarket.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; background: #F5F5F5; color: #080808; font-weight: 700">السوق</a>
<a href="Heritage.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">التراث</a>
<a href="Profile.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">ملفي</a>
<a href="WebMarketEn.dc.html" style="font-family: 'Space Grotesk', sans-serif; min-height: 44px; min-width: 44px; padding: 0 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid #5E5E5E">EN</a>
</nav>
</header>
<main style="flex: 1; padding: 32px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700">سوق دولاب</h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Merchant.dc.html" style="height: 48px; padding: 0 18px; display: flex; align-items: center; border: 1px solid #080808; font-size: 15px; font-weight: 700">لوحة التاجر</a>
<a href="Sell.dc.html" style="height: 48px; padding: 0 18px; display: flex; align-items: center; background: #080808; color: #F5F5F5; font-size: 15px; font-weight: 700">+ اعرض منتجك</a>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px">
<label for="wq" style="font-size: 12px; color: #5E5E5E">ابحث بالنوع أو اللون أو المقاس</label>
<input id="wq" type="search" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #080808; color: #080808; font-size: 16px; font-family: inherit">
</div>
<div role="group" aria-label="النوع" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height: 48px; padding: 0 18px; border: 1px solid #080808; background: {{f.bg}}; color: {{f.fg}}; font-size: 14px; font-weight: 600; font-family: inherit">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #D9D9D9; display: flex; flex-direction: column">
<div style="height: 220px; background: #E6E6E6; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5E5E5E">صورة المنتج</div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 13px; color: #5E5E5E">{{p.seller}} · {{p.kind}}</span>
<span style="font-size: 16px; font-weight: 700">[السعر]</span>
</div>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5E5E5E">كل منتج هنا مرّ بالفحص والمراجعة قبل نشره.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { filter: 'الكل' }; }
renderVals() {
const all = [
{ name: 'ثوب سوداني', seller: 'مصمم', kind: 'تراثي' },
{ name: 'جلابية بيضاء', seller: 'متجر', kind: 'جديد' },
{ name: 'جاكيت رسمي', seller: 'فرد', kind: 'مستعمل' },
{ name: 'شال', seller: 'متجر', kind: 'تراثي' },
{ name: 'حذاء جلدي', seller: 'متجر', kind: 'جديد' },
{ name: 'قميص كتان', seller: 'فرد', kind: 'مستعمل' }
];
const cur = (this.state && this.state.filter) || 'الكل';
const products = all.filter((p) => cur === 'الكل' || p.kind === cur);
const filters = ['الكل', 'جديد', 'مستعمل', 'تراثي'].map((label) => ({
label, on: label === cur,
bg: label === cur ? '#080808' : 'transparent',
fg: label === cur ? '#F5F5F5' : '#080808',
pick: () => this.setState({ filter: label })
}));
return { products, filters };
}
}
</script>
</body>
</html>
