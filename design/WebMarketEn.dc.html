<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web — Dolab Market</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="ltr" style="box-sizing: border-box; min-height: 800px; background: #F5F5F5; color: #080808; display: flex; flex-direction: column">
<header style="background: #080808; color: #F5F5F5; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="WebHomeEn.dc.html" style="display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="48" height="24" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2 22L10 4l8 18M15 22L24 2l9 20M30 22l8-16 8 16M1 22h46"></path></svg><span style="font-size: 24px; font-family: 'Space Grotesk', sans-serif; font-weight: 700">DOLAB</span></a>
<nav aria-label="Main navigation" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 15px">
<a href="WebHomeEn.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">Home</a>
<a href="WebWardrobeEn.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">Wardrobe</a>
<a href="StylistEn.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">Stylist</a>
<a href="WebMarketEn.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; background: #F5F5F5; color: #080808; font-weight: 700">Market</a>
<a href="HeritageEn.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">Heritage</a>
<a href="ProfileEn.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">Profile</a>
<a href="WebMarket.dc.html" style="font-family: 'Space Grotesk', sans-serif; min-height: 44px; min-width: 44px; padding: 0 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid #5E5E5E">عربي</a>
</nav>
</header>
<main style="flex: 1; padding: 32px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700">Dolab Market</h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="MerchantEn.dc.html" style="height: 48px; padding: 0 18px; display: flex; align-items: center; border: 1px solid #080808; font-size: 15px; font-weight: 700">Merchant dashboard</a>
<a href="SellEn.dc.html" style="height: 48px; padding: 0 18px; display: flex; align-items: center; background: #080808; color: #F5F5F5; font-size: 15px; font-weight: 700">+ Sell</a>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px">
<label for="wq" style="font-size: 12px; color: #5E5E5E">Search by type, colour or size</label>
<input id="wq" type="search" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #080808; color: #080808; font-size: 16px; font-family: inherit">
</div>
<div role="group" aria-label="Type" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height: 48px; padding: 0 18px; border: 1px solid #080808; background: {{f.bg}}; color: {{f.fg}}; font-size: 14px; font-weight: 600; font-family: inherit">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #D9D9D9; display: flex; flex-direction: column">
<div style="height: 220px; background: #E6E6E6; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5E5E5E">Product photo</div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 13px; color: #5E5E5E">{{p.seller}} · {{p.kind}}</span>
<span style="font-size: 16px; font-weight: 700">[price]</span>
</div>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5E5E5E">Every product here was checked and reviewed before publishing.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { filter: 'All' }; }
renderVals() {
const all = [
{ name: 'Sudanese toub', seller: 'Designer', kind: 'Heritage' },
{ name: 'White jalabiya', seller: 'Store', kind: 'New' },
{ name: 'Formal jacket', seller: 'Individual', kind: 'Used' },
{ name: 'Shawl', seller: 'Store', kind: 'Heritage' },
{ name: 'Leather shoes', seller: 'Store', kind: 'New' },
{ name: 'Linen shirt', seller: 'Individual', kind: 'Used' }
];
const cur = (this.state && this.state.filter) || 'All';
const products = all.filter((p) => cur === 'All' || p.kind === cur);
const filters = ['All', 'New', 'Used', 'Heritage'].map((label) => ({
label, on: label === cur,
bg: label === cur ? '#080808' : 'transparent',
fg: label === cur ? '#F5F5F5' : '#080808',
pick: () => this.setState({ filter: label })
}));
return { products, filters };
}
}
</script>
</body>
</html>
