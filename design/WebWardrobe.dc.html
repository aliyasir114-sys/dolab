<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الموقع — دولابي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div dir="rtl" style="box-sizing: border-box; min-height: 800px; background: #F5F5F5; color: #080808; display: flex; flex-direction: column">
<header style="background: #080808; color: #F5F5F5; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="WebHome.dc.html" style="display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="48" height="24" viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2 22L10 4l8 18M15 22L24 2l9 20M30 22l8-16 8 16M1 22h46"></path></svg><span style="font-size: 24px; font-weight: 700">دولاب</span></a>
<nav aria-label="التنقل الرئيسي" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 15px">
<a href="WebHome.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">الرئيسية</a>
<a href="WebWardrobe.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; background: #F5F5F5; color: #080808; font-weight: 700">دولابي</a>
<a href="Stylist.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">المستشار</a>
<a href="WebMarket.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">السوق</a>
<a href="Heritage.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">التراث</a>
<a href="Profile.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: #A8A8A8">ملفي</a>
<a href="WebWardrobeEn.dc.html" style="font-family: 'Space Grotesk', sans-serif; min-height: 44px; min-width: 44px; padding: 0 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid #5E5E5E">EN</a>
</nav>
</header>
<div style="flex: 1; padding: 32px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<aside style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700">دولابي</h1>
<span style="font-size: 13px; color: #5E5E5E">{{summary}}</span>
<div role="group" aria-label="الحالة" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="flex: 1 1 120px; height: 44px; padding: 0 14px; text-align: start; border: 1px solid #080808; background: {{f.bg}}; color: {{f.fg}}; font-size: 14px; font-weight: 600; font-family: inherit">{{f.label}}</button>
</sc-for>
</div>
<button type="button" style="height: 48px; border: 0; background: #080808; color: #F5F5F5; font-size: 15px; font-weight: 700; font-family: inherit">+ إضافة من الصور</button>
<a href="Dashboard.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: underline">لوحة الموضة</a>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="Item.dc.html" style="background: #FFFFFF; border: 1px solid #D9D9D9; display: flex; flex-direction: column">
<div style="height: 200px; background: #E6E6E6; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #5E5E5E">صورة القطعة</div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 16px; font-weight: 600">{{it.name}}</span>
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 10px; border: 1px solid #080808; background: {{it.bg}}; color: {{it.fg}}">{{it.status}}</span>
</div>
</a>
</sc-for>
</main>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { filter: 'الكل' }; }
renderVals() {
const all = [
{ name: 'قميص أبيض كلاسيكي', status: 'متاح' },
{ name: 'بنطلون أسود', status: 'متاح' },
{ name: 'جلابية بيضاء', status: 'متاح' },
{ name: 'حذاء أسود', status: 'متاح' },
{ name: 'جاكيت رمادي', status: 'في الغسيل' },
{ name: 'شال', status: 'للبيع' }
];
const cur = (this.state && this.state.filter) || 'الكل';
const items = all.filter((x) => cur === 'الكل' || x.status === cur).map((x) => ({
...x,
bg: x.status === 'متاح' ? '#080808' : '#FFFFFF',
fg: x.status === 'متاح' ? '#F5F5F5' : '#080808'
}));
const filters = ['الكل', 'متاح', 'في الغسيل', 'للبيع'].map((label) => ({
label, on: label === cur,
bg: label === cur ? '#080808' : 'transparent',
fg: label === cur ? '#F5F5F5' : '#080808',
pick: () => this.setState({ filter: label })
}));
const avail = all.filter((x) => x.status === 'متاح').length;
return { items, filters, summary: all.length + ' قطع في الدولاب · ' + avail + ' متاحة للارتداء' };
}
}
</script>
</body>
</html>
